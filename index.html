<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Апгрейд сознания</title>
  <style>
    /* Подключение элегантных шрифтов */
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300;400;500&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Гарантированное центрирование на всех устройствах */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      /* Мистический анимированный фон */
      background: linear-gradient(135deg, #070314, #1b0a3a, #0d1430);
      background-size: 300% 300%;
      animation: bgShift 12s ease infinite;
      font-family: 'Montserrat', sans-serif;
      color: #e0e0e0;
      overflow-x: hidden;
    }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Главная карточка (эффект стекла) */
    .card {
      width: 100%;
      max-width: 420px; /* Защита от растягивания на широких мониторах */
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 45px 30px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* Аватарка */
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 25px;
      border: 2px solid rgba(138, 75, 255, 0.4);
      box-shadow: 0 0 25px rgba(138, 75, 255, 0.3);
      /* Замените ссылку ниже на URL вашей картинки */
      background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=300&auto=format&fit=crop') center/cover;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 15px rgba(138, 75, 255, 0.4);
    }

    p.bio {
      font-size: 14px;
      line-height: 1.6;
      color: #aeb1c4;
      margin-bottom: 35px;
      font-weight: 300;
    }

    /* Кнопки */
    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    /* Блик при наведении на кнопку */
    .btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      transition: left 0.6s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      background: rgba(138, 75, 255, 0.1);
      border-color: rgba(138, 75, 255, 0.5);
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3), 0 0 15px rgba(138, 75, 255, 0.25);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar"></div>
    <h1>Апгрейд сознания</h1>
    <p class="bio">Исследование глубин психологии, философии и религии.<br>Присоединяйтесь к нашему пути.</p>
    
    <div class="links">
      <a href="https://t.me/ArchitectMind_bot" target="_blank" class="btn">Telegram-бот: Архитектор</a>
      <a href="https://t.me/ваш_канал" target="_blank" class="btn">Telegram-канал</a>
      <a href="https://youtube.com/@ваш_канал" target="_blank" class="btn">YouTube-канал</a>
    </div>
  </div>
</body>
</html>
