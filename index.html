<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Апгрейд сознания | Ссылки</title>
    
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Подключение иконок FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Подключение элегантных шрифтов Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* Базовые настройки типографики */
        :root {
            --font-title: 'Cinzel', serif;
            --font-body: 'Montserrat', sans-serif;
            --accent-glow: rgba(138, 43, 226, 0.6); /* Фиолетовое свечение */
        }

        body {
            font-family: var(--font-body);
            background-color: #050505;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: var(--font-title);
        }

        /* Анимированный глубокий фон (звездный/мистический градиент) */
        .mystic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #050505 80%);
            z-index: -2;
            overflow: hidden;
        }

        /* Медленно движущиеся частицы (звезды/пыль) */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 160px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 130px 80px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.7), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: moveStars 150s linear infinite;
            opacity: 0.4;
            z-index: -1;
        }

        @keyframes moveStars {
            from { transform: translateY(0) translateX(0); }
            to { transform: translateY(-1000px) translateX(-500px); }
        }

        /* Свечение за профилем */
        .profile-glow {
            position: absolute;
            width: 120px;
            height: 120px;
            background: var(--accent-glow);
            border-radius: 50%;
            filter: blur(40px);
            animation: pulseGlow 4s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0.9; }
        }

        /* Стеклянные кнопки с эффектами наведения (Glassmorphism) */
        .glass-button {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .glass-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: all 0.5s ease;
        }

        .glass-button:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(138, 43, 226, 0.4);
            box-shadow: 0 10px 40px rgba(138, 43, 226, 0.2);
        }

        .glass-button:hover::before {
            left: 150%;
        }

        .glass-button:active {
            transform: translateY(0) scale(0.98);
        }

        /* Эффект плавающего контейнера */
        .floating-container {
            animation: floatContainer 6s ease-in-out infinite;
        }

        @keyframes floatContainer {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Линия разделителя */
        .mystic-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            width: 80%;
            margin: 0 auto;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative px-4 py-12 antialiased selection:bg-purple-900 selection:text-white">

    <div class="mystic-bg"></div>
    <div class="stars"></div>

    <!-- Основной контейнер -->
    <main class="w-full max-w-md mx-auto z-10 floating-container">
        
        <header class="flex flex-col items-center text-center mb-10">
            
            <!-- Аватар -->
            <div class="relative w-32 h-32 mb-6 flex justify-center items-center">
                <div class="profile-glow"></div>
                <!-- Заглушка изображения. Используем абстрактное мистическое изображение или градиент -->
                <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop" 
                     alt="Логотип Апгрейд сознания" 
                     class="w-28 h-28 rounded-full object-cover border-2 border-white/10 shadow-2xl relative z-10 
                            transition-transform duration-700 hover:scale-105 hover:rotate-3">
            </div>

            <!-- Заголовок и описание -->
            <h1 class="text-3xl md:text-4xl font-semibold tracking-wider text-white mb-3 drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]">
                Апгрейд сознания
            </h1>
            
            <div class="mystic-divider mb-4"></div>
            
            <p class="text-sm md:text-base text-gray-300 font-light leading-relaxed max-w-xs px-2 opacity-90">
                Исследование глубин психологии, философии и религии. <br>
                <span class="italic text-purple-300/80 mt-1 block">Присоединяйтесь к нашему пути.</span>
            </p>
        </header>

        <nav class="flex flex-col gap-4 w-full">
            
            <!-- Telegram -->
            <a href="#" class="glass-button rounded-2xl p-4 flex items-center justify-between group text-decoration-none text-white">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-400 group-hover:bg-blue-500 group-hover:text-white transition-colors duration-300">
                        <i class="fa-brands fa-telegram text-xl"></i>
                    </div>
                    <span class="font-medium tracking-wide">Telegram канал</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs opacity-40 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
            </a>

            <!-- YouTube -->
            <a href="#" class="glass-button rounded-2xl p-4 flex items-center justify-between group text-decoration-none text-white">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-red-500/10 flex items-center justify-center text-red-500 group-hover:bg-red-500 group-hover:text-white transition-colors duration-300">
                        <i class="fa-brands fa-youtube text-xl"></i>
                    </div>
                    <span class="font-medium tracking-wide">YouTube</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs opacity-40 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
            </a>

            <!-- Instagram -->
            <a href="#" class="glass-button rounded-2xl p-4 flex items-center justify-between group text-decoration-none text-white">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-pink-500/10 flex items-center justify-center text-pink-400 group-hover:bg-gradient-to-tr group-hover:from-yellow-400 group-hover:via-pink-500 group-hover:to-purple-600 group-hover:text-white transition-all duration-300">
                        <i class="fa-brands fa-instagram text-xl"></i>
                    </div>
                    <span class="font-medium tracking-wide">Instagram</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs opacity-40 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
            </a>

            <!-- TikTok -->
            <a href="#" class="glass-button rounded-2xl p-4 flex items-center justify-between group text-decoration-none text-white">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-white group-hover:bg-black group-hover:shadow-[0_0_10px_rgba(255,255,255,0.3)] transition-colors duration-300">
                        <i class="fa-brands fa-tiktok text-xl"></i>
                    </div>
                    <span class="font-medium tracking-wide">TikTok</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs opacity-40 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
            </a>

            <!-- Наш сайт -->
            <a href="#" class="glass-button rounded-2xl p-4 flex items-center justify-between group text-decoration-none text-white mt-2 border-purple-500/30">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-purple-500/20 flex items-center justify-center text-purple-300 group-hover:bg-purple-600 group-hover:text-white transition-colors duration-300 shadow-[0_0_15px_rgba(138,43,226,0.3)]">
                        <i class="fa-solid fa-globe text-xl"></i>
                    </div>
                    <span class="font-medium tracking-wide text-purple-100">Наш сайт</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs opacity-40 group-hover:opacity-100 group-hover:translate-x-1 transition-all text-purple-300"></i>
            </a>

        </nav>

        <footer class="mt-12 text-center pb-8">
            <p class="text-xs text-gray-500 font-light tracking-widest uppercase">
                &copy; 2026 Апгрейд сознания
            </p>
        </footer>
    </main>

    <!-- Скрипт для плавного появления при загрузке -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.querySelector('main');
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            container.style.transition = 'opacity 1s ease-out, transform 1s ease-out';
            
            setTimeout(() => {
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
